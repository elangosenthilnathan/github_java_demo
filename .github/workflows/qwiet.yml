---
name: Harness SAST/SCA/Secrets/Container Scanning 

on:
  pull_request:
    branches:
      - main  
  workflow_dispatch:
  push:
    branches:
      - main  

jobs:
  Harness-Static-Analysis:
    #runs-on: ubuntu-latest
    runs-on: windows-latest
    #container: shiftleft/core:latest

    steps:
    - uses: actions/checkout@v4

    # - name: Set up Java
    #   uses: actions/setup-java@v4
    #   with:
    #     distribution: 'zulu'   # or 'zulu', 'corretto', 'microsoft', etc.
